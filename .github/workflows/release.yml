name: Create Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    name: Create Tag and Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Ensure all tags are fetched
      run: |
        git fetch --force --tags --prune

    - name: Get SDK version and release notes
      id: get_tag
      run: |
        set -euo pipefail

        SDK_VERSION=$(sed -nE 's/^[[:space:]]*private let _version = "([^"]+)"[[:space:]]*$/\1/p' Sources/Votice/Core/Managers/ConfigurationManager.swift)
        if [[ ! "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid or missing SDK version: '$SDK_VERSION'"
          echo "Expected _version to use semantic versioning (X.Y.Z)"
          exit 1
        fi

        echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
        echo "SDK version found: $SDK_VERSION"

        if git rev-parse "refs/tags/$SDK_VERSION" >/dev/null 2>&1; then
          echo "Tag $SDK_VERSION already exists; there is nothing to release."
          echo "should_release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "should_release=true" >> "$GITHUB_OUTPUT"

        LATEST_TAG=$(git tag --sort=-version:refname | head -n1)
        echo "Latest tag found: $LATEST_TAG"
        echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

        # Get the latest commit message and changelog
        COMMIT_MESSAGE=$(git log -1 --pretty=%B)
        echo "commit_message<<EOF" >> "$GITHUB_OUTPUT"
        echo "$COMMIT_MESSAGE" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
        
        # Get changelog since last tag
        if [[ -n "$LATEST_TAG" ]]; then
          CHANGELOG=$(git log --pretty=format:"- %s" $LATEST_TAG..HEAD)
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        else
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "- Initial release" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Git tag
      if: steps.get_tag.outputs.should_release == 'true'
      run: |
        SDK_VERSION="${{ steps.get_tag.outputs.sdk_version }}"
        
        # Configure git and create tag
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        echo "Creating tag: $SDK_VERSION"
        git tag "$SDK_VERSION"
        git push origin "$SDK_VERSION"

    - name: Create GitHub Release
      if: steps.get_tag.outputs.should_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_tag.outputs.sdk_version }}
        name: "Votice SDK v${{ steps.get_tag.outputs.sdk_version }}"
        body: |
          ## 🚀 Votice SDK v${{ steps.get_tag.outputs.sdk_version }}
          
          ### Changes in this release:
          ${{ steps.get_tag.outputs.changelog }}
          
          ### Latest commit:
          ${{ steps.get_tag.outputs.commit_message }}
          
          ### Installation
          
          #### Swift Package Manager
          Add this to your `Package.swift`:
          
          ```swift
          dependencies: [
              .package(url: "https://github.com/ArtCC/votice-sdk.git", from: "${{ steps.get_tag.outputs.sdk_version }}")
          ]
          ```
          
          Or add it through Xcode:
          1. File → Add Package Dependencies
          2. Enter: `https://github.com/ArtCC/votice-sdk.git`
          3. Select version: `${{ steps.get_tag.outputs.sdk_version }}`
          
          ---
          *This release was automatically generated from commit ${{ github.sha }}*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
